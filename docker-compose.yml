version: '3.8'

services:
  cypherdon-one:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cypherdon-one-app
    restart: always
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - KONSOLE_API_KEY=${KONSOLE_API_KEY:-dd70410faaa91ab497c369c60eaef68a09cc83fd6ad439276b8557a53a545bfb}
      - PORT=3000
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/api/analyze"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
